<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Редактор JSON</title>
<script>
  document.write('<link rel="stylesheet" href="editor.css?t=' + Date.now() + '">');
</script>
</head>
<body>

<header class="ed-header">
  <h1>Редактор JSON</h1>
  <div class="ed-actions">
    <button id="btnLoadUrl" class="ed-btn">Загрузить с сайта</button>
    <label class="ed-btn file-label">
      Загрузить файл
      <input type="file" id="fileInput" accept=".json,application/json" hidden>
    </label>
    <button id="btnDownload" class="ed-btn primary">Скачать JSON</button>
  </div>
</header>

<main class="ed-main">
  <aside class="ed-sidebar">
    <div class="ed-sidebar-title">Секции верхнего уровня</div>
    <div id="topSections" class="ed-list"></div>
    <button id="addTopSection" class="ed-btn small">+ секция</button>

    <div class="ed-sidebar-title" style="margin-top:18px">Все сущности</div>

    <div style="display:flex; gap:6px; margin-bottom:8px">
      <input type="text" id="entitySearch" class="ed-input" placeholder="Поиск…" style="flex:1">
      <select id="entityTypeFilter" class="ed-input" style="width:130px"></select>
    </div>

    <div id="entityList" class="ed-list"></div>
    <button id="addEntity" class="ed-btn small">+ сущность</button>
  </aside>

  <section class="ed-content" id="content">
    <div class="ed-placeholder">
      Выберите сущность слева или загрузите JSON сверху.
    </div>
  </section>
</main>

<div id="toast" class="toast"></div>

<script>
  document.write('<script src="editor.js?t=' + Date.now() + '"><\/script>');
</script>
</body>
</html>
